name: GitHub Snake Game



on:

  # Schedule the workflow to run daily at midnight UTC

  schedule:

    - cron: "0 0 * * *"



  # Allow manual triggering of the workflow

  workflow_dispatch:



  # Trigger the workflow on pushes to the main branch

  push:

    branches:

      - main



jobs:

  generate:

    runs-on: ubuntu-latest

    timeout-minutes: 10



    steps:

      # Step 1: Checkout the repository

      - name: Checkout Repository

        uses: actions/checkout@v3



      # Step 2: Generate the snake animations

      - name: Generate GitHub Contributions Snake Animations

        uses: Platane/snk@v3

        with:

          # GitHub username to generate the animation for

          github_user_name: ${{ github.repository_owner }}



          # Define the output files and their configurations

          outputs: |
            dist/github-snake-dark.gif?palette=github-dark&color_snake=#39d353&color_dots=#39d353,#26a641,#0e4429

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Crop loader/progress bar from GIF
        run: |
          set -euo pipefail
          IN="dist/github-snake-dark.gif"
          TMP="dist/github-snake-dark-cropped.gif"

          if [ ! -f "$IN" ]; then
            echo "GIF not found: $IN"
            exit 1
          fi

          W="$(identify -ping -format '%w\n' "${IN}[0]" | head -n 1)"
          H="$(identify -ping -format '%h\n' "${IN}[0]" | head -n 1)"
          CROP_BOTTOM_PX="${CROP_BOTTOM_PX:-80}"
          NEW_H="$((H - CROP_BOTTOM_PX))"

          if [ "$NEW_H" -le 0 ]; then
            echo "Invalid crop: H=$H CROP_BOTTOM_PX=$CROP_BOTTOM_PX"
            exit 1
          fi

          convert "$IN" -coalesce -crop "${W}x${NEW_H}+0+0" +repage -layers Optimize "$TMP"
          mv "$TMP" "$IN"



      # Step 3: Deploy the generated files to the 'output' branch

      - name: Deploy to Output Branch

        uses: peaceiris/actions-gh-pages@v3

        with:

          github_token: ${{ secrets.GITHUB_TOKEN }}

          publish_dir: ./dist

          publish_branch: output

          # Optionally, you can set a custom commit message

          commit_message: "Update snake animation [skip ci]"
